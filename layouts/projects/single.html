<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  <link rel="stylesheet" href="/css/main.css">
</head>

  <body class="min-h-screen bg-zinc-950 text-zinc-100">
    <main class="mx-auto max-w-4xl px-6 py-16 sm:px-10 sm:py-24">
      <a class="font-mono text-xs uppercase tracking-[0.2em] text-zinc-500 transition-colors hover:text-amber-300" href="/">&larr; All projects</a>

      <h1 class="mt-12 max-w-3xl font-display text-5xl leading-none tracking-tight text-zinc-50 sm:text-7xl">{{ .Title }}</h1>
      <p class="mt-6 max-w-2xl text-xl leading-8 text-zinc-400">{{ .Params.summary }}</p>
      <div class="mt-8 flex flex-wrap gap-x-6 gap-y-2 font-mono text-xs uppercase tracking-[0.16em] text-zinc-500">
        <span>{{ .Params.role }}</span>
        <span>{{ .Params.year }}</span>
      </div>

    {{ with .Params.image }}
      <img class="mt-12 w-full rounded-2xl border border-zinc-800 object-cover shadow-2xl shadow-black/30" src="{{ . }}" alt="{{ $.Title }}">
    {{ end }}

      <ul class="mt-8 flex flex-wrap gap-2">
      {{ range .Params.technologies }}
      <li class="rounded-full border border-zinc-700 px-3 py-1 text-sm text-zinc-300">{{ . }}</li>
      {{ end }}
    </ul>

      <article class="project-copy mt-16 max-w-2xl border-t border-zinc-800 pt-8">
      {{ .Content }}
    </article>
  </main>
</body>

</html>

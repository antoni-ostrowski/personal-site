<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  <link rel="stylesheet" href="/css/main.css">
</head>

<body class="bg-stone-50 text-stone-950">
  <main class="mx-auto max-w-3xl px-6 py-16 sm:py-24">
    <a class="text-sm text-stone-500 hover:text-stone-950" href="/">&larr; All projects</a>

    <h1 class="mt-10 text-4xl font-semibold tracking-tight">{{ .Title }}</h1>
    <p class="mt-4 text-xl text-stone-600">{{ .Params.summary }}</p>
    <div class="mt-6 flex gap-4 text-sm text-stone-500">
      <span>{{ .Params.role }}</span>
      <span>{{ .Params.year }}</span>
    </div>

    {{ with .Params.image }}
    <img class="mt-10 w-full rounded-lg" src="{{ . }}" alt="{{ $.Title }}">
    {{ end }}

    <ul class="mt-6 flex flex-wrap gap-2">
      {{ range .Params.technologies }}
      <li class="rounded-full bg-stone-200 px-3 py-1 text-sm text-stone-700">{{ . }}</li>
      {{ end }}
    </ul>

    <article class="mt-12 max-w-none text-lg leading-8 text-stone-800">
      {{ .Content }}
    </article>
  </main>
</body>

</html>

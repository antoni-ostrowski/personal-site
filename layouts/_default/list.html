{{ define "title" }}{{ .Title }} | {{ .Site.Title }}{{ end }}

{{ define "main" }}
<a class="text-xs text-zinc-500 transition-colors hover:text-accent" href="/">&larr;
	Back</a>

<h1 class="mt-4 text-4xl leading-none text-zinc-50 sm:text-5xl">{{ .Title }}</h1>

<ul class="mt-10 divide-y divide-zinc-800 border-y border-zinc-800">
	{{ range sort .Pages ".Weight" "desc" }}
	<li class="group py-4">
		<a class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xl font-medium text-zinc-100 transition-colors group-hover:text-accent"
			href="{{ .RelPermalink }}">{{ .Title }}{{ partial "language-badge.html" . }}</a>
		{{ with .Params.summary }}
		<p class="mt-2 text-zinc-400">{{ . }}</p>
		{{ end }}
	</li>
	{{ end }}
</ul>
{{ end }}

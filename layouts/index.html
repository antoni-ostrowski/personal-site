<!doctype html>
<html lang="{{ .Site.Language.Lang }}">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Site.Title }}</title>
  <link rel="stylesheet" href="/css/main.css">
</head>

<body class="min-h-screen bg-zinc-950 text-zinc-100">
  <main class="mx-auto max-w-4xl px-6 py-16 sm:px-10 sm:py-24">
    <header class="max-w-2xl">
      <h1 class="mt-5 font-display text-5xl leading-none tracking-tight text-zinc-50 sm:text-7xl">{{ .Site.Title }}</h1>
      <nav class="mt-8 flex flex-wrap gap-3" aria-label="Contact and profile links">
        <a class="inline-flex items-center gap-2 rounded-full border border-zinc-700 px-4 py-2 text-sm text-zinc-300 transition-colors hover:border-amber-300 hover:text-amber-300"
          href="https://github.com/antoni-ostrowski" target="_blank" rel="noreferrer" aria-label="GitHub profile">
          <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.33-1.76-1.33-1.76-1.09-.75.08-.74.08-.74 1.2.09 1.83 1.23 1.83 1.23 1.07 1.83 2.8 1.3 3.48.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.95 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.29-1.55 3.29-1.23 3.29-1.23.65 1.65.24 2.87.12 3.17.77.84 1.23 1.91 1.23 3.22 0 4.62-2.81 5.64-5.49 5.94.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.58A12 12 0 0 0 12 .5Z" />
          </svg>
          GitHub
        </a>
        <p
          class="inline-flex items-center gap-2 rounded-full border border-zinc-700 px-4 py-2 text-sm text-zinc-300 transition-colors hover:border-amber-300 hover:text-amber-300">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 5.25h16.5v13.5H3.75z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 6 7.5 6 7.5-6" />
          </svg>
          antoni.ostrowski.dev@gmail.com
        </p>
        <a class="inline-flex items-center gap-2 rounded-full bg-amber-300 px-4 py-2 text-sm font-medium text-zinc-950 transition-colors hover:bg-amber-200"
          href="/antoni-ostrowski-cv.pdf" target="_blank" rel="noreferrer" aria-label="Open resume in a new tab">
          <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M13.5 3H6.75A1.75 1.75 0 0 0 5 4.75v14.5A1.75 1.75 0 0 0 6.75 21h10.5A1.75 1.75 0 0 0 19 19.25V8.5L13.5 3Z" />
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M13.5 3v5.5H19M12 11v6m0 0 2.25-2.25M12 17l-2.25-2.25" />
          </svg>
          Resume
        </a>
      </nav>
    </header>

    <ul class="mt-20 divide-y divide-zinc-800 border-y border-zinc-800">
      {{ range where .Site.RegularPages "Section" "projects" }}
      <li class="group py-7">
        <a class="flex items-baseline justify-between gap-6 text-2xl font-medium text-zinc-100 transition-colors group-hover:text-amber-300"
          href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ with .Params.summary }}
        <p class="mt-3 max-w-2xl text-zinc-400">{{ . }}</p>
        {{ end }}
      </li>
      {{ end }}
    </ul>
  </main>
</body>

</html>

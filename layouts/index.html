<!doctype html>
<html lang="{{ .Site.Language.Lang }}">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Site.Title }}</title>
    <link rel="stylesheet" href="/css/main.css">
  </head>

  <body class="bg-stone-50 text-stone-950">
    <main class="mx-auto max-w-3xl px-6 py-16 sm:py-24">
      <h1 class="text-4xl font-semibold tracking-tight">{{ .Site.Title }}</h1>
      <ul class="mt-12 divide-y divide-stone-200 border-y border-stone-200">
      {{ range where .Site.RegularPages "Section" "projects" }}
      <li class="py-6">
        <a class="text-xl font-medium underline decoration-stone-300 underline-offset-4 hover:decoration-stone-950" href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ with .Params.summary }}
          <p class="mt-2 text-stone-600">{{ . }}</p>
        {{ end }}
      </li>
      {{ end }}
      </ul>
    </main>
  </body>

</html>
